<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea6a13"/>
      <stop offset="100%" stop-color="#250a2b"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe3a4"/>
      <stop offset="100%" stop-color="#ea6a13"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="160" stroke="#ffe3a4" stroke-width="2" opacity="0.15" fill="none"/>
  <circle cx="200" cy="200" r="120" stroke="#f0f0f0" stroke-width="1" opacity="0.1" fill="none"/>

  <!-- Avatar silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="url(#avatarGrad)"/>
  <!-- Body -->
  <path d="M110 330 Q110 240 200 240 Q290 240 290 330 Z" fill="url(#avatarGrad)"/>

  <!-- Code brackets accent -->
  <text x="70" y="120" font-family="monospace" font-size="28" fill="#ffe3a4" opacity="0.5">&lt;/&gt;</text>
  <text x="300" y="280" font-family="monospace" font-size="20" fill="#250a2b" opacity="0.3">{" "}</text>

  <!-- Initials -->
  <text x="200" y="215" text-anchor="middle" font-family="Host Grotesk, sans-serif" font-size="42" font-weight="bold" fill="#250a2b">LN</text>
</svg>
